# environments\staging\eks-cluster-existing-vpc.yaml

AWSTemplateFormatVersion: '2010-09-09'
Description: EKS Cluster and Node Group using existing VPC/Subnets

Parameters:
  ClusterName:
    Type: String
    Default: stg-eks-cluster

  VpcId:
    Type: String
    Description: Existing VPC ID created by Terraform

  PrivateSubnet1Id:
    Type: String
    Description: First private subnet ID
  PrivateSubnet2Id:
    Type: String
    Description: Second private subnet ID

  NodeInstanceType:
    Type: String
    Default: t3.medium
  NodeGroupName:
    Type: String
    Default: stg-node-group
  DesiredCapacity:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 3
  MinSize:
    Type: Number
    Default: 1

Resources:
  ### EKS Cluster Role ###
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  ### EKS Cluster ###
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: "1.34"
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
        EndpointPublicAccess: true
        EndpointPrivateAccess: true

  ### Node Group Role ###
  NodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  ### EKS Node Group ###
  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Ref NodeGroupName
      NodeRole: !GetAtt NodeInstanceRole.Arn
      Subnets:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      ScalingConfig:
        MinSize: !Ref MinSize
        MaxSize: !Ref MaxSize
        DesiredSize: !Ref DesiredCapacity
      InstanceTypes:
        - !Ref NodeInstanceType
      AmiType: BOTTLEROCKET_x86_64
      DiskSize: 20

Outputs:
  ClusterName:
    Value: !Ref EKSCluster
  ClusterEndpoint:
    Value: !GetAtt EKSCluster.Endpoint
  NodeGroupName:
    Value: !Ref NodeGroup
